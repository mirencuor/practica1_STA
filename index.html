<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grupo 9 - STA (Grupo 10 - STA)</title>
    <!-- Enlazamos la hoja de estilos -->
    <link rel="stylesheet" href="style.css">
    <!-- Importamos la fuente bonita (Poppins) desde Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="contenedor">
        <h1>Grupo 9</h1>
        <p class="nombres">Unai y Miren</p>
        <p class="asignatura">Servicios Telemáticos Avanzados</p>
        
        <!-- Requisito de la práctica: Campo de texto con un botón -->
        <div class="formulario">
            <!-- Añadido id="buscador" -->
            <input type="text" id="buscador" placeholder="Escribe una película (en inglés)...">
            <!-- Añadido id="boton" -->
            <button id="boton">Enviar</button>
        </div>

        <!-- Contenedor vacío donde JS pintará el director y el año -->
        <div id="resultado"></div>
    </div>

    <!-- El script debe ir al final, justo antes de cerrar el body -->
    <script src="script.js"></script>
</body>
</html>
